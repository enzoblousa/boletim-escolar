name: Deploy

# Reutilizado pelo CI-CD (deploy automático) e disparável manualmente (rollback manual para qualquer versão publicada)
on:
  workflow_call:
    inputs:
      ambiente:
        type: string
        required: true
      versao:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      ambiente:
        description: 'Ambiente de destino'
        type: choice
        options: [ homologacao, producao ]
        required: true
      versao:
        description: 'Versão publicada no GHCR para implantar (sem o "v", ex.: 1.0.0) — use para rollback manual'
        type: string
        required: true

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: deploy (${{ inputs.ambiente }} -> ${{ inputs.versao }})
    runs-on: ubuntu-latest
    # Environment do GitHub: guarda os Secrets/Variables do ambiente e registra o histórico de deploys
    environment: ${{ inputs.ambiente }}
    concurrency: deploy-${{ inputs.ambiente }}
    timeout-minutes: 15
    env:
      APP_IMAGE: ghcr.io/${{ github.repository }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_USER: ${{ vars.POSTGRES_USER }}
      POSTGRES_DB: ${{ vars.POSTGRES_DB }}
      ASPNETCORE_ENVIRONMENT: ${{ vars.ASPNETCORE_ENVIRONMENT }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validar configuração do ambiente
        run: |
          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "::error::Secret POSTGRES_PASSWORD não configurado no Environment '${{ inputs.ambiente }}'"
            exit 1
          fi

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # O ambiente é simulado no próprio runner (efêmero). Para o deploy partir de um estado realista,
      # primeiro sobe a última versão estável (última GitHub Release) com dados, como se já estivesse em produção.
      - name: Restaurar estado atual do ambiente (última release estável)
        run: |
          ATUAL=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')
          ATUAL="${ATUAL#v}"
          if [ -z "$ATUAL" ] || [ "$ATUAL" = "${{ inputs.versao }}" ]; then
            echo "Nenhuma release estável anterior: ambiente começa vazio."
            exit 0
          fi
          echo "Ambiente atualmente na versão $ATUAL"
          APP_VERSION="$ATUAL" docker compose -p media-escolar up -d --no-build --pull missing
          ./scripts/smoke-test.sh http://localhost:8080 "$ATUAL"

      # Sobe a nova versão, roda o smoke test e, se falhar, faz rollback automático para a versão que estava no ar
      - name: Deploy da versão ${{ inputs.versao }} (com rollback automático)
        run: ./scripts/deploy.sh "${{ inputs.versao }}"

      - name: Estado final do ambiente
        if: always()
        run: |
          curl -s http://localhost:8080/version || true
          echo
          docker compose -p media-escolar ps || true
